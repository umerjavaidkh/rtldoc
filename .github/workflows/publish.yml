name: Publish to PyPI

# Runs when a GitHub Release is published. Uses PyPI's Trusted Publisher
# (OIDC) mechanism -- no API token is stored anywhere, in this repo or on
# GitHub. One-time setup required on pypi.org (see README's Development
# section): register this repo + workflow file as a trusted publisher for
# the "pdf-rtldoc" project before the first release runs.
on:
  release:
    types: [published]

permissions:
  id-token: write  # required for OIDC trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
